name: docker-rocm

# Manual dispatch only — GitHub-hosted runners lack disk for the ~40GB
# rocm/pytorch base image. Images are built locally on the deployment
# host instead; this workflow is here for a future self-hosted runner.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/qwen3-tts-rocm

jobs:
  rocm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tags=${IMAGE}:rocm-${GITHUB_REF_NAME#v},${IMAGE}:rocm-latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:rocm-edge" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push ROCm image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.rocm
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
